<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Config Import</title>
<style>
:root{
--bg:#f4f5f7;--panel:#fff;--input:#fff;--code-bg:#f1f2f5;--text:#1f2329;--muted:#6b7280;
--border:#e4e6ea;--border1:#cbd0d7;--accent:#2f6fed;--accent-soft:#e9f0fe;--ok:#1a7f4b;
--warn:#a96500;--warn-bg:#fff6e6;--chip:#f0f1f4;--hover:#f7f8fa;--danger:#c0392b
}
[data-theme=dark]{
--bg:#16181d;--panel:#1d2026;--input:#242830;--code-bg:#242830;--text:#e6e8eb;--muted:#9aa1ab;
--border:#2c3038;--border1:#3b414b;--accent:#5b8cf7;--accent-soft:#20283a;--ok:#4ec98a;
--warn:#e0a94a;--warn-bg:#392e1c;--chip:#242830;--hover:#23272e;--danger:#f07a6a
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.app{display:flex;flex-direction:column;gap:12px;padding:16px;max-width:1180px;margin:0 auto}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:17px;font-weight:600}
.head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--border1);
background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--border1)}
.overwrite{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;cursor:pointer;
padding:5px 9px;border:1px solid var(--border);border-radius:6px;background:var(--panel)}
.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.source{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:11px 13px}
.source[data-state=error],.source[data-state=missing]{border-color:var(--border1);background:var(--warn-bg)}
.source-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.source-name{font-weight:600}
.badge{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge[data-kind=ok]{background:var(--accent-soft);color:var(--accent)}
.badge[data-kind=off]{background:var(--chip);color:var(--muted)}
.badge[data-kind=warn]{background:transparent;border:1px solid var(--border1);color:var(--warn)}
.source-count{margin-left:auto;color:var(--muted);font-size:12.5px}
.source-path{margin-top:6px;display:flex;gap:6px;align-items:baseline;min-width:0}
.source-path .k{color:var(--muted);font-size:12px;flex:0 0 auto}
.source-path code{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code-bg);
padding:1px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.source-note{margin-top:6px;font-size:12.5px;color:var(--warn);word-break:break-word}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selection{color:var(--muted);font-size:12.5px;margin-left:2px}
.selection[data-kind=warn]{color:var(--warn)}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters-label{color:var(--muted);font-size:12.5px;flex:0 0 auto}
.filters-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--border1);
background:var(--panel);color:var(--text);cursor:pointer;white-space:nowrap}
.chip:hover:not(:disabled){background:var(--hover)}
.chip:disabled{opacity:.5;cursor:not-allowed}
.chip[data-on="1"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[data-empty="1"]{color:var(--muted);border-style:dashed}
.chip-count{margin-left:6px;font-size:11.5px;color:var(--muted)}
.chip[data-on="1"] .chip-count{color:var(--accent)}
.visible{color:var(--muted);font-size:12.5px;margin-left:auto}
.pager{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;
background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px}
.page-info{color:var(--text)}
.page-total,.pager-selected{color:var(--muted)}
.page-size{display:flex;align-items:center;gap:6px;color:var(--muted);margin-left:auto}
.page-size select{font:inherit;font-size:12.5px;padding:3px 6px;border-radius:6px;border:1px solid var(--border1);
background:var(--input);color:var(--text)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--border1);
background:var(--warn-bg);color:var(--text);border-radius:8px;padding:9px 12px;font-size:12.5px;
word-break:break-word}
.banner .banner-text{flex:1 1 240px}
.list{border:1px solid var(--border);border-radius:8px;background:var(--panel);overflow:hidden}
table.list{border-collapse:collapse;width:100%;table-layout:fixed}
table.list th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;
border-bottom:1px solid var(--border);background:var(--hover)}
table.list td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.list col.c-check{width:38px}
table.list col.c-name{width:20%}
table.list col.c-source{width:11%}
table.list col.c-format{width:13%}
table.list col.c-url{width:25%}
table.list col.c-models{width:11%}
table.list col.c-flags{width:18%}
table.list td.cell-flags{white-space:normal}
table.list tr:last-child td{border-bottom:0}
table.list tr[data-conflict="1"]{background:var(--warn-bg)}
.cell-check{width:36px}
.cell-check input{margin:0;vertical-align:middle}
.cell-name .name{font-weight:500}
.cell-name .kind{margin-left:6px;font-size:11px;color:var(--muted);background:var(--chip);
padding:0 6px;border-radius:999px}
.cell-url code{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
.flag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;margin-right:4px;
background:var(--chip);color:var(--muted);white-space:nowrap}
.flag[data-kind=warn]{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.flag[data-kind=info]{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.result{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:12px 14px}
.result h2{margin:0 0 4px;font-size:14px;font-weight:600}
.result .summary{margin:0;font-size:13px}
.result .resolved{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.res-list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.res-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--border);
padding-top:6px;font-size:12.5px}
.res-name{font-weight:500;min-width:120px}
.res-status{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.res-row[data-status=imported] .res-status{background:var(--accent-soft);color:var(--ok)}
.res-row[data-status=skipped] .res-status{background:var(--chip);color:var(--warn)}
.res-row[data-status=failed] .res-status{background:transparent;border:1px solid var(--border1);color:var(--danger)}
.res-reason{flex:1 1 260px;color:var(--muted);word-break:break-word}
.res-id{color:var(--muted);font:11.5px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div>
      <h1 id="app-title"></h1>
      <p id="app-sub"></p>
    </div>
    <div class="actions">
      <label class="overwrite"><input id="overwrite" type="checkbox"><span id="overwrite-label"></span></label>
      <button id="rescan" class="btn" type="button"></button>
      <button id="import" class="btn primary" type="button"></button>
    </div>
  </header>
  <section id="sources" class="sources"></section>
  <div id="banner" class="banner" hidden></div>
  <div class="filters">
    <span id="filters-label" class="filters-label"></span>
    <div id="filters" class="filters-chips"></div>
  </div>
  <section class="toolbar">
    <button id="select-all" class="btn ghost" type="button"></button>
    <button id="invert" class="btn ghost" type="button"></button>
    <button id="clear-selection" class="btn ghost" type="button"></button>
    <span id="selection" class="selection"></span>
    <span id="visible" class="visible"></span>
  </section>
  <main id="list" class="list"></main>
  <section id="pager" class="pager" hidden>
    <button id="page-first" class="btn ghost" type="button"></button>
    <button id="page-prev" class="btn ghost" type="button"></button>
    <span id="page-info" class="page-info"></span>
    <button id="page-next" class="btn ghost" type="button"></button>
    <button id="page-last" class="btn ghost" type="button"></button>
    <span id="page-total" class="page-total"></span>
    <span id="pager-selected" class="pager-selected"></span>
    <label class="page-size"><span id="page-size-label"></span><select id="page-size"></select></label>
  </section>
  <section id="result" class="result" hidden></section>
</div>

  function reasonText(reason) {

    var list = el('ul', 'res-list');
    state.result.rows.forEach(function (row) {
      var item = el('li', 'res-row');
      if (item.setAttribute) item.setAttribute('data-status', row.status);
      item.appendChild(el('span', 'res-name', row.name));
      item.appendChild(el('span', 'res-status', statusLabel(row.status)));
      var reason = row.status === 'imported' ? '' : reasonText(row.reason) || t('reasonUnspecified');
      item.appendChild(el('span', 'res-reason', reason));
      if (row.providerId) item.appendChild(el('span', 'res-id', t('providerId', { id: row.providerId })));
      list.appendChild(item);
    });
    host.appendChild(list);
  }

  function renderFilters() {
    var host = byId('filters');
    if (!host) return;
    var active = filterActive();
    var nodes = [];
    var all = el('button', 'chip', t('filterAll'));
    all.type = 'button';
    if (all.setAttribute) {
      all.setAttribute('data-all', '1');
      all.setAttribute('data-on', active ? '0' : '1');
      all.setAttribute('aria-pressed', active ? 'false' : 'true');
      all.setAttribute('title', t('clearFilterTip'));
    }
    all.addEventListener('click', clearFilter);
    nodes.push(all);
    // chip 上的条数是本次 scan 里该来源的条目数（全部可见时的条数）；
    // 没检测到的来源照样出 chip，置灰并计 0，用户能看出这一轮到底扫了哪些来源。
    state.sources.forEach(function (source) {
      var count = sourceItemCount(source.id);
      var on = state.filter[source.id] === true;
      var chip = el('button', 'chip');
      chip.type = 'button';
      if (chip.setAttribute) {
        chip.setAttribute('data-source', source.id);
        chip.setAttribute('data-on', on ? '1' : '0');
        chip.setAttribute('data-count', String(count));
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        chip.setAttribute('title', t('filterTip'));
        if (count === 0) chip.setAttribute('data-empty', '1');
      }
      chip.appendChild(el('span', 'chip-label', source.label));
      chip.appendChild(el('span', 'chip-count', String(count)));
      chip.addEventListener('click', function () { toggleFilter(source.id); });
      nodes.push(chip);
    });
    clear(host);
    nodes.forEach(function (node) { host.appendChild(node); });
  }

  function renderPager() {
    var host = byId('pager');
    if (!host) return;
    setText('page-first', t('pageFirst'));
    setText('page-prev', t('pagePrev'));
    setText('page-next', t('pageNext'));
    setText('page-last', t('pageLast'));
    setText('page-size-label', t('pageSize'));
    if (state.phase !== 'ready') {
      host.hidden = true;
      return;
    }
    var model = pageModel();
    var busy = state.importing;
    // 只有一页时保留分页栏（每页条数还得能改），翻页按钮整体置灰。
    var multi = model.pages > 1;
    setText('page-info', t('pageInfo', { page: state.page, pages: model.pages }));
    setText('page-total', t('pageTotal', { n: model.visible.length }));
    // 勾选跨页保存：工具条与粘在底部的分页栏各显示一份总数，滚到列表任意位置都能核对没漏选。
    setText('pager-selected', t('pagerSelected', { n: selectedItems().length }));
    var first = byId('page-first');
    if (first) first.disabled = busy || !multi || state.page <= 1;
    var prev = byId('page-prev');
    if (prev) prev.disabled = busy || !multi || state.page <= 1;
    var next = byId('page-next');
    if (next) next.disabled = busy || !multi || state.page >= model.pages;
    var last = byId('page-last');
    if (last) last.disabled = busy || !multi || state.page >= model.pages;
    var select = byId('page-size');
    if (select) {
      select.value = String(state.perPage);
      select.disabled = busy;
    }
    host.hidden = false;
  }

  function render() {
    renderChrome();
    renderFilters();
    renderSources();
    renderToolbar();
    renderList();
    renderPager();
    renderBanner();
    renderResult();
  }

  function renderListViews() {
    renderChrome();
    renderFilters();
    renderToolbar();
    renderList();
    renderPager();
  }

  function toggleItem(key, checked) {
    if (checked) state.selected[key] = true;
    else delete state.selected[key];
    renderListViews();
  }

  // 全选只把筛选后的条目补进勾选集合，筛选之外的勾选保持不动（切筛选不丢勾选）。
  function selectAllVisible() {
    applyToVisible(function (key) { state.selected[key] = true; });
    renderListViews();
  }

  // 取消全选是一键清空：跨页、跨来源的勾选全清掉。
  function clearSelection() {
    state.selected = {};
    renderListViews();
  }

  function invertSelection() {
    applyToVisible(function (key) {
      if (state.selected[key] === true) delete state.selected[key];
      else state.selected[key] = true;
    });
    renderListViews();
  }

  // 换筛选条件回到第 1 页；真越界时由 pageModel 夹到末页兜底。
  function toggleFilter(sourceId) {
    if (state.filter[sourceId] === true) delete state.filter[sourceId];
    else state.filter[sourceId] = true;
    state.page = 1;
    renderListViews();
  }

  function clearFilter() {
    state.filter = {};
    state.page = 1;
    renderListViews();
  }

  function goPage(page) {
    state.page = page;
    renderListViews();
  }

  function setPageSize(size) {
    if (PER_PAGE_OPTIONS.indexOf(size) < 0) return;
    state.perPage = size;
    state.page = 1;
    renderListViews();
  }

  function scan() {
    if (state.importing) return;
    state.phase = 'loading';
    state.error = '';
    state.importError = '';
    state.result = null;
    state.selected = {};
    render();
    hostCall('sources.scan', { sources: SOURCE_ORDER }).then(function (value) {
      var scanned = normalizeScan(value);
      state.sources = scanned.sources;
      state.items = scanned.items;
      state.ignored = scanned.ignored;
      state.conflictUnavailable = scanned.conflictUnavailable;
      state.phase = 'ready';
      pruneFilter();
      render();
    }).catch(function (error) {
      state.phase = 'failed';
      state.items = [];
      state.selected = {};
      state.conflictUnavailable = false;
      state.error = describeError(error);
      render();
    });
  }

  function runImport() {
    var picked = selectedItems();
    if (state.importing || state.phase !== 'ready') return;
    if (picked.length < 1 || picked.length > MAX_IMPORT) return;
    state.importing = true;
    state.importError = '';
    state.result = null;
    renderChrome();
    renderToolbar();
    renderList();
    renderPager();
    renderBanner();
    hostCall('import.apply', {
      items: picked.map(function (item) {
        return { sourceId: item.sourceId, sourceKey: item.sourceKey, overwrite: state.overwrite };
      })
    }).then(function (value) {
      var result = normalizeImportResult(value, picked);
      state.importing = false;
      state.result = result;
      render();
      notifyHost(t('notifyDone', { imported: result.imported, skipped: result.skipped, failed: result.failed }), 'info');
    }).catch(function (error) {
      state.importing = false;
      state.importError = describeError(error);
      render();
    });
  }

  function buildPageSize() {
    var select = byId('page-size');
    if (!select) return;
    clear(select);
    PER_PAGE_OPTIONS.forEach(function (size) {
      var option = el('option', '', String(size));
      option.value = String(size);
      if (option.setAttribute) option.setAttribute('value', String(size));
      select.appendChild(option);
    });
    select.value = String(state.perPage);
  }

  function wire() {
    on('rescan', 'click', scan);
    on('import', 'click', runImport);
    on('select-all', 'click', selectAllVisible);
    on('invert', 'click', invertSelection);
    on('clear-selection', 'click', clearSelection);
    on('page-first', 'click', function () { goPage(1); });
    on('page-prev', 'click', function () { goPage(state.page - 1); });
    on('page-next', 'click', function () { goPage(state.page + 1); });
    on('page-last', 'click', function () { goPage(pageModel().pages); });
    var sizeSelect = byId('page-size');
    if (sizeSelect && sizeSelect.addEventListener) {
      sizeSelect.addEventListener('change', function () { setPageSize(parseInt(sizeSelect.value, 10)); });
    }
    buildPageSize();
    var overwrite = byId('overwrite');
    if (overwrite && overwrite.addEventListener) {
      overwrite.addEventListener('change', function () {
        state.overwrite = overwrite.checked === true;
        renderChrome();
      });
    }
    window.addEventListener('gonavi:host-preferences', function () {
      readPrefs();
      render();
    });
  }

  function boot() {
    wire();
    readPrefs();
    render();
    scan();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
